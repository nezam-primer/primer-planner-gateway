name: Draft/HOLD promotion guard
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: write
jobs:
  semantic-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Recheck current PR state and return only a still-held PR to draft
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh pr view "$PR_URL" --json title,state,isDraft --jq '[.title,.state,.isDraft] | @tsv')"
          IFS=$'\t' read -r title state is_draft <<< "$current"
          echo "Current state=$state draft=$is_draft title=$title"
          if [[ "$state" != "OPEN" || "$is_draft" == "true" ]]; then
            echo "No mutation: PR is not an open ready PR."
            exit 0
          fi
          if [[ "$title" != "[DRAFT]"* && "$title" != "[HOLD]"* ]]; then
            echo "No mutation: current title no longer declares DRAFT/HOLD."
            exit 0
          fi
          echo "Current PR still declares DRAFT/HOLD; returning it to draft."
          gh pr ready --undo "$PR_URL"
