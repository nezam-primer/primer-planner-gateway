name: Control Center shadow contract
on:
  pull_request:
    paths:
      - 'control-center-shadow/**'
      - '.github/workflows/control-center-shadow.yml'
  push:
    branches: [main]
    paths:
      - 'control-center-shadow/**'
      - '.github/workflows/control-center-shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check control-center-shadow/app.js
          node --check control-center-shadow/validate-data.mjs
      - name: Payload contract and fail-closed tests
        run: node --test control-center-shadow/validate-data.test.mjs
      - name: Validate bundled sample
        run: node control-center-shadow/validate-data.mjs control-center-shadow/data.sample.json
